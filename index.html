<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101113">
  <title>VifArgent</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 12H23L34 45L45 12H54L37 54H27L10 12Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #101113;
      color: #E8E5DF;
      font-family: "Bodoni Moda", "Noto Serif SC", serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body {
      position: relative;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(460px circle at var(--mx, 50%) var(--my, 50%), rgba(232, 229, 223, 0.055), transparent 70%);
      transition: opacity 0.4s ease;
    }

    .stage {
      position: relative;
      z-index: 2;
      padding: 2.6rem 3rem;
      display: grid;
      place-items: center;
    }

    .corner {
      position: fixed;
      width: 12px;
      height: 12px;
      pointer-events: none;
      opacity: 0.25;
      animation: breathe 5s ease-in-out infinite;
    }
    .corner.tl { top: 24px; left: 24px; border-top: 1px solid #E8E5DF; border-left: 1px solid #E8E5DF; }
    .corner.tr { top: 24px; right: 24px; border-top: 1px solid #E8E5DF; border-right: 1px solid #E8E5DF; animation-delay: 1.2s; }
    .corner.bl { bottom: 24px; left: 24px; border-bottom: 1px solid #E8E5DF; border-left: 1px solid #E8E5DF; animation-delay: 2.4s; }
    .corner.br { bottom: 24px; right: 24px; border-bottom: 1px solid #E8E5DF; border-right: 1px solid #E8E5DF; animation-delay: 3.6s; }

    @keyframes breathe {
      0%, 100% { opacity: 0.14; transform: scale(1); }
      50% { opacity: 0.42; transform: scale(1.08); }
    }

    h1 {
      font-family: "Bodoni Moda", "Noto Serif SC", serif;
      font-optical-sizing: none;
      font-variation-settings: "opsz" 36, "wght" 500;
      font-weight: 500;
      font-size: clamp(2.8rem, 11.5vw, 5.6rem);
      line-height: 0.88;
      letter-spacing: -0.018em;
      color: #E8E5DF;
      user-select: none;
      cursor: pointer;
      opacity: 0;
      animation: fadeRise 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), text-shadow 0.35s ease;
    }
    h1:hover {
      transform: translateY(-2px);
      text-shadow: 0 0 28px rgba(232, 229, 223, 0.22);
    }
    h1.pulse {
      animation: shimmerHit 0.55s ease;
      opacity: 1;
    }

    .flourish {
      margin-left: 0.015em;
      font-style: italic;
      font-weight: 400;
    }

    @keyframes fadeRise {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes shimmerHit {
      0%   { opacity: 1; text-shadow: -4px 0 rgba(210, 115, 138, 0.45), 4px 0 rgba(180, 210, 255, 0.4); transform: scale(1.015); }
      45%  { opacity: 0.78; filter: blur(1px); }
      100% { opacity: 1; text-shadow: none; filter: blur(0); transform: scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <span class="corner tl" aria-hidden="true"></span>
  <span class="corner tr" aria-hidden="true"></span>
  <span class="corner bl" aria-hidden="true"></span>
  <span class="corner br" aria-hidden="true"></span>

  <main class="stage">
    <h1 id="wordmark">Vif<span class="flourish">Argent</span></h1>
  </main>

  <script>
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    const root = document.documentElement;
    let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mouse = { x: -9999, y: -9999, active: false };
    const ripples = [];
    const particles = [];
    const COUNT = 56;

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < COUNT; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.24,
          vy: (Math.random() - 0.5) * 0.24,
          r: Math.random() * 1.4 + 0.45,
          a: Math.random() * 0.35 + 0.08,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    window.addEventListener("resize", () => {
      resize();
      initParticles();
    });

    window.addEventListener("pointermove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
      root.style.setProperty("--mx", e.clientX + "px");
      root.style.setProperty("--my", e.clientY + "px");
    });

    window.addEventListener("pointerdown", (e) => {
      ripples.push({ x: e.clientX, y: e.clientY, r: 4, alpha: 0.34 });
    });

    const wordmark = document.getElementById("wordmark");
    wordmark.addEventListener("click", () => {
      wordmark.classList.remove("pulse");
      void wordmark.offsetWidth;
      wordmark.classList.add("pulse");
    });

    function frame(t) {
      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        let boost = 0;
        if (mouse.active) {
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 130 && dist > 1) {
            const force = (1 - dist / 130) * 0.45;
            p.x += (dx / dist) * force;
            p.y += (dy / dist) * force;
            boost = (1 - dist / 130) * 0.35;
          }
        }

        const flicker = Math.sin(t * 0.0014 + p.phase) * 0.08;
        const alpha = Math.max(0.03, Math.min(0.75, p.a + flicker + boost));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(232, 229, 223, " + alpha.toFixed(3) + ")";
        ctx.fill();
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 2.6;
        rp.alpha *= 0.962;
        if (rp.alpha < 0.01) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(232, 229, 223, " + rp.alpha.toFixed(3) + ")";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      requestAnimationFrame(frame);
    }

    resize();
    initParticles();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
