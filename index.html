<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101113">
  <title>⌈ VifArgent ⌋</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 12H23L34 45L45 12H54L37 54H27L10 12Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101113;
      --ink: #E8E5DF;
      --muted: #85827C;
      --lain: #d2738a;
      --mint: #63B58D;
      --line: rgba(232, 229, 223, 0.11);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "JetBrains Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      overflow: hidden;
      transition: background 0.6s ease;
      background-image:
        radial-gradient(circle at 50% 48%, rgba(210, 115, 138, 0.04), transparent 55%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.014) 0px, rgba(255, 255, 255, 0.014) 1px, transparent 1px, transparent 3px);
    }
    body.visible-mode {
      background-image:
        radial-gradient(circle at 50% 48%, rgba(210, 115, 138, 0.11), transparent 58%),
        repeating-linear-gradient(0deg, rgba(210, 115, 138, 0.028) 0px, rgba(210, 115, 138, 0.028) 1px, transparent 1px, transparent 3px);
    }

    .frame {
      position: relative;
      width: min(520px, 100%);
      padding: 3.4rem 2rem 2.8rem;
      text-align: center;
    }

    .corner {
      position: absolute;
      font-size: 1.05rem;
      line-height: 1;
      color: var(--muted);
      user-select: none;
      cursor: pointer;
      animation: wiredPulse 4.2s ease-in-out infinite;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .corner:hover { color: var(--lain); transform: scale(1.25); }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; animation-delay: 0.7s; }
    .corner.bl { bottom: 0; left: 0; animation-delay: 1.4s; }
    .corner.br { bottom: 0; right: 0; animation-delay: 2.1s; }

    @keyframes wiredPulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.8; color: var(--lain); }
    }

    h1 {
      display: inline-block;
      font-family: "Bodoni Moda", "Noto Serif SC", serif;
      font-optical-sizing: none;
      font-variation-settings: "opsz" 36, "wght" 500;
      font-weight: 500;
      font-size: clamp(2.7rem, 11.5vw, 5.4rem);
      line-height: 0.88;
      letter-spacing: -0.018em;
      color: var(--ink);
      user-select: none;
      cursor: pointer;
      transition: text-shadow 0.2s ease, transform 0.15s ease;
    }
    h1:hover {
      text-shadow: -2px 0 rgba(210, 115, 138, 0.45), 2px 0 rgba(99, 181, 141, 0.35);
    }
    h1.glitch {
      animation: glitchHit 0.36s steps(2, end);
    }
    @keyframes glitchHit {
      0%   { transform: translate(0, 0); text-shadow: -3px 0 var(--lain), 3px 0 var(--mint); }
      25%  { transform: translate(-3px, 1px); text-shadow: 3px 0 var(--lain), -3px 0 var(--mint); }
      50%  { transform: translate(2px, -1px) skewX(-4deg); opacity: 0.7; }
      75%  { transform: translate(-1px, 0) skewX(3deg); }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .flourish {
      margin-left: 0.015em;
      font-style: italic;
      font-weight: 400;
    }

    /* fauux-style signal equalizer */
    .signal-bar {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      user-select: none;
    }
    .signal-bar span {
      display: inline-block;
      animation: wave 2.4s ease-in-out infinite;
    }
    .signal-bar .d6 { animation-delay: 0.9s; }
    .signal-bar .d5 { animation-delay: 0.75s; }
    .signal-bar .d4 { animation-delay: 0.6s; }
    .signal-bar .d2 { animation-delay: 0.35s; }
    .signal-bar .d1 { animation-delay: 0.18s; }
    .note-btn {
      background: none;
      border: none;
      font: inherit;
      color: var(--lain);
      cursor: pointer;
      padding: 0 0.2em;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .note-btn:hover { color: var(--ink); transform: scale(1.2); }
    .note-btn.playing {
      color: var(--mint);
      text-shadow: 0 0 10px rgba(99, 181, 141, 0.55);
      animation: noteBeat 1.2s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.85; color: var(--ink); }
    }
    @keyframes noteBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.22); }
    }

    /* fauux-style rotating phrase */
    .phrase {
      margin-top: 1.15rem;
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      color: rgba(232, 229, 223, 0.65);
      min-height: 1.4em;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }
    .phrase:hover { color: var(--lain); }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      width: 58%;
      margin: 1.75rem auto 1.25rem;
    }

    /* fauux-style invisible / visible toggle */
    .presence {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      color: var(--muted);
      line-height: 1.9;
    }
    .presence button {
      background: none;
      border: none;
      font: inherit;
      letter-spacing: inherit;
      color: var(--lain);
      cursor: pointer;
      padding: 0.1rem 0.25rem;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }
    .presence button:hover {
      color: var(--ink);
      text-shadow: 0 0 8px rgba(210, 115, 138, 0.5);
    }

    .secret-toast {
      margin-top: 1.1rem;
      font-size: 0.64rem;
      letter-spacing: 0.22em;
      color: var(--mint);
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .secret-toast.show { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="frame">
    <span class="corner tl" title="00">&#8968;</span>
    <span class="corner tr" title="01">&#8969;</span>
    <span class="corner bl" title="02">&#8970;</span>
    <span class="corner br" title="03">&#8971;</span>

    <h1 id="title">Vif<span class="flourish">Argent</span></h1>

    <div class="signal-bar" aria-label="Signal pulse">
      <span class="d6">&#9553;</span><span class="d5">&#9618;</span><span class="d4">&#9617;</span>
      <span class="d2">&#9553;</span><span class="d1">&#9617;</span>
      <button type="button" class="note-btn" id="sound-toggle" title="Wired hum">&#9835;</button>
      <span class="d1">&#9617;</span><span class="d2">&#9553;</span>
      <span class="d4">&#9617;</span><span class="d5">&#9618;</span><span class="d6">&#9553;</span>
    </div>

    <p class="phrase" id="phrase" title="click to shift">[present day, present time]</p>

    <hr class="divider">

    <div class="presence">
      <span id="presence-text">You are invisible.</span><br>
      <button type="button" id="presence-btn">[Go visible]</button>
    </div>

    <p class="secret-toast" id="secret"></p>
  </main>

  <script>
    const phrases = [
      "[present day, present time]",
      "[wired sound for wired people]",
      "[make me sad]",
      "[让我难过]",
      "[悲しくさせて]",
      "[no matter where you are]",
      "[everyone is connected]",
      "[close the world, open the next]"
    ];
    let pIdx = 0;
    const phraseEl = document.getElementById("phrase");
    function nextPhrase() {
      pIdx = (pIdx + 1) % phrases.length;
      phraseEl.textContent = phrases[pIdx];
    }
    setInterval(nextPhrase, 2800);
    phraseEl.addEventListener("click", nextPhrase);

    // Title glitch + click easter egg
    const titleEl = document.getElementById("title");
    const secretEl = document.getElementById("secret");
    let titleClicks = 0;
    let secretTimer = null;

    function showSecret(msg) {
      secretEl.textContent = msg;
      secretEl.classList.add("show");
      clearTimeout(secretTimer);
      secretTimer = setTimeout(() => secretEl.classList.remove("show"), 3600);
    }

    titleEl.addEventListener("click", () => {
      titleEl.classList.remove("glitch");
      void titleEl.offsetWidth;
      titleEl.classList.add("glitch");
      nextPhrase();
      titleClicks++;
      if (titleClicks === 3) {
        showSecret("LAYER 07 // PROTOCOL_7 ACCEPTED");
        titleClicks = 0;
      }
    });

    // Invisible / Visible toggle
    let isVisible = false;
    const presenceText = document.getElementById("presence-text");
    const presenceBtn = document.getElementById("presence-btn");
    presenceBtn.addEventListener("click", () => {
      isVisible = !isVisible;
      document.body.classList.toggle("visible-mode", isVisible);
      presenceText.textContent = isVisible ? "You are visible. [signal: 0x07]" : "You are invisible.";
      presenceBtn.textContent = isVisible ? "[Go invisible]" : "[Go visible]";
    });

    // Corner click easter egg
    document.querySelectorAll(".corner").forEach((c) => {
      c.addEventListener("click", () => {
        showSecret("NODE // " + c.getAttribute("title") + " LOCKED");
      });
    });

    // Keyboard secret: type "lain"
    let keyBuf = "";
    window.addEventListener("keydown", (e) => {
      if (e.key.length !== 1) return;
      keyBuf = (keyBuf + e.key.toLowerCase()).slice(-4);
      if (keyBuf === "lain") {
        titleEl.classList.remove("glitch");
        void titleEl.offsetWidth;
        titleEl.classList.add("glitch");
        showSecret("LET'S ALL LOVE LAIN");
        keyBuf = "";
      }
    });

    // Gentle Web Audio Wired hum toggle (no external files)
    let audioCtx = null;
    let humNodes = null;
    const soundBtn = document.getElementById("sound-toggle");

    soundBtn.addEventListener("click", () => {
      if (humNodes) {
        humNodes.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
        setTimeout(() => {
          humNodes.osc1.stop();
          humNodes.osc2.stop();
          humNodes = null;
        }, 380);
        soundBtn.classList.remove("playing");
        return;
      }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = "sine";
      osc2.type = "triangle";
      osc1.frequency.value = 110;
      osc2.frequency.value = 164.81;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.025, audioCtx.currentTime + 0.6);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.start();
      osc2.start();
      humNodes = { osc1, osc2, gain };
      soundBtn.classList.add("playing");
      showSecret("AUDIO // WIRED HUM ON");
    });
  </script>
</body>
</html>
