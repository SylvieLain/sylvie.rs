<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101113">
  <title>⌈ VifArgent ⌋</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 12H23L34 45L45 12H54L37 54H27L10 12Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101113;
      --ink: #E8E5DF;
      --muted: #85827C;
      --lain: #d2738a;
      --mint: #63B58D;
      --line: rgba(232, 229, 223, 0.11);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "JetBrains Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      overflow: hidden;
      transition: background 0.6s ease;
      background-image:
        radial-gradient(circle at 50% 48%, rgba(210, 115, 138, 0.04), transparent 55%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.014) 0px, rgba(255, 255, 255, 0.014) 1px, transparent 1px, transparent 3px);
    }
    body.visible-mode {
      background-image:
        radial-gradient(circle at 50% 48%, rgba(210, 115, 138, 0.11), transparent 58%),
        repeating-linear-gradient(0deg, rgba(210, 115, 138, 0.028) 0px, rgba(210, 115, 138, 0.028) 1px, transparent 1px, transparent 3px);
    }

    .frame {
      position: relative;
      width: min(520px, 100%);
      padding: 3.4rem 2rem 2.8rem;
      text-align: center;
    }

    .corner {
      position: absolute;
      font-size: 1.05rem;
      line-height: 1;
      color: var(--muted);
      user-select: none;
      cursor: pointer;
      animation: wiredPulse 4.2s ease-in-out infinite;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .corner:hover { color: var(--lain); transform: scale(1.25); }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; animation-delay: 0.7s; }
    .corner.bl { bottom: 0; left: 0; animation-delay: 1.4s; }
    .corner.br { bottom: 0; right: 0; animation-delay: 2.1s; }

    @keyframes wiredPulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.8; color: var(--lain); }
    }

    h1 {
      display: inline-block;
      font-family: "Bodoni Moda", "Noto Serif SC", serif;
      font-optical-sizing: none;
      font-variation-settings: "opsz" 36, "wght" 500;
      font-weight: 500;
      font-size: clamp(2.7rem, 11.5vw, 5.4rem);
      line-height: 0.88;
      letter-spacing: -0.018em;
      color: var(--ink);
      user-select: none;
      cursor: pointer;
      transition: text-shadow 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
    }
    h1:hover {
      text-shadow: -2px 0 rgba(210, 115, 138, 0.45), 2px 0 rgba(99, 181, 141, 0.35);
    }
    h1.locked {
      cursor: default;
      text-shadow: 0 0 22px rgba(99, 181, 141, 0.35);
    }
    h1.glitch {
      animation: glitchHit 0.36s steps(2, end);
    }
    @keyframes glitchHit {
      0%   { transform: translate(0, 0); text-shadow: -3px 0 var(--lain), 3px 0 var(--mint); }
      25%  { transform: translate(-3px, 1px); text-shadow: 3px 0 var(--lain), -3px 0 var(--mint); }
      50%  { transform: translate(2px, -1px) skewX(-4deg); opacity: 0.7; }
      75%  { transform: translate(-1px, 0) skewX(3deg); }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .flourish {
      margin-left: 0.015em;
      font-style: italic;
      font-weight: 400;
    }

    .signal-bar {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      user-select: none;
    }
    .signal-bar span {
      display: inline-block;
      animation: wave 2.4s ease-in-out infinite;
    }
    .signal-bar .d6 { animation-delay: 0.9s; }
    .signal-bar .d5 { animation-delay: 0.75s; }
    .signal-bar .d4 { animation-delay: 0.6s; }
    .signal-bar .d2 { animation-delay: 0.35s; }
    .signal-bar .d1 { animation-delay: 0.18s; }
    .note-btn {
      background: none;
      border: none;
      font: inherit;
      color: var(--lain);
      cursor: pointer;
      padding: 0 0.2em;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .note-btn:hover { color: var(--ink); transform: scale(1.2); }
    .note-btn.playing {
      color: var(--mint);
      text-shadow: 0 0 10px rgba(99, 181, 141, 0.55);
      animation: noteBeat 1.2s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.85; color: var(--ink); }
    }
    @keyframes noteBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.22); }
    }

    .phrase {
      margin-top: 1.15rem;
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      color: rgba(232, 229, 223, 0.65);
      min-height: 1.4em;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }
    .phrase:hover { color: var(--lain); }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      width: 58%;
      margin: 1.75rem auto 1.25rem;
    }

    .presence {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      color: var(--muted);
      line-height: 1.9;
    }
    .presence button {
      background: none;
      border: none;
      font: inherit;
      letter-spacing: inherit;
      color: var(--lain);
      cursor: pointer;
      padding: 0.1rem 0.25rem;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }
    .presence button:hover {
      color: var(--ink);
      text-shadow: 0 0 8px rgba(210, 115, 138, 0.5);
    }

    .secret-toast {
      margin-top: 1.1rem;
      font-size: 0.64rem;
      letter-spacing: 0.22em;
      color: var(--mint);
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .secret-toast.show { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="frame">
    <span class="corner tl" title="00">&#8968;</span>
    <span class="corner tr" title="01">&#8969;</span>
    <span class="corner bl" title="02">&#8970;</span>
    <span class="corner br" title="03">&#8971;</span>

    <h1 id="title">Vif<span class="flourish">Argent</span></h1>

    <div class="signal-bar" aria-label="Signal pulse">
      <span class="d6">&#9553;</span><span class="d5">&#9618;</span><span class="d4">&#9617;</span>
      <span class="d2">&#9553;</span><span class="d1">&#9617;</span>
      <button type="button" class="note-btn playing" id="sound-toggle" title="Sound ON / OFF">&#9835;</button>
      <span class="d1">&#9617;</span><span class="d2">&#9553;</span>
      <span class="d4">&#9617;</span><span class="d5">&#9618;</span><span class="d6">&#9553;</span>
    </div>

    <p class="phrase" id="phrase" title="click to shift">[present day, present time]</p>

    <hr class="divider">

    <div class="presence">
      <span id="presence-text">You are invisible.</span><br>
      <button type="button" id="presence-btn">[Go visible]</button>
    </div>

    <p class="secret-toast" id="secret"></p>
  </main>

  <script>
    const phrases = [
      "[present day, present time]",
      "[wired sound for wired people]",
      "[make me sad]",
      "[让我难过]",
      "[悲しくさせて]",
      "[no matter where you are]",
      "[everyone is connected]",
      "[close the world, open the next]"
    ];
    let pIdx = 0;
    const phraseEl = document.getElementById("phrase");
    function nextPhrase() {
      pIdx = (pIdx + 1) % phrases.length;
      phraseEl.textContent = phrases[pIdx];
    }
    setInterval(nextPhrase, 2800);
    phraseEl.addEventListener("click", nextPhrase);

    const titleEl = document.getElementById("title");
    const secretEl = document.getElementById("secret");
    const soundBtn = document.getElementById("sound-toggle");
    let secretTimer = null;

    function showSecret(msg) {
      secretEl.textContent = msg;
      secretEl.classList.add("show");
      clearTimeout(secretTimer);
      secretTimer = setTimeout(() => secretEl.classList.remove("show"), 3200);
    }

    // ---- Experimental Web Audio Engine (Sound ON by default) ----
    let audioCtx = null;
    let masterGain = null;
    let humGain = null;
    let soundEnabled = true;
    let isTrackPlaying = false;
    let trackLockTimer = null;
    let lastTrackIdx = -1;

    function ensureAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) {
        audioCtx = new Ctx();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = soundEnabled ? 0.9 : 0;
        masterGain.connect(audioCtx.destination);

        // Subtle continuous Wired ambient hum
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        humGain = audioCtx.createGain();
        osc1.type = "sine";
        osc2.type = "triangle";
        osc1.frequency.value = 82.41;
        osc2.frequency.value = 123.47;
        humGain.gain.value = 0.016;
        osc1.connect(humGain);
        osc2.connect(humGain);
        humGain.connect(masterGain);
        osc1.start();
        osc2.start();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    // Attempt default autoplay immediately, and unlock seamlessly on first gesture
    try { ensureAudio(); } catch (_) {}
    ["pointerdown", "keydown"].forEach((evt) => {
      window.addEventListener(evt, () => {
        if (soundEnabled) ensureAudio();
      }, { once: true });
    });

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.classList.toggle("playing", soundEnabled);
      if (soundEnabled) {
        const ctx = ensureAudio();
        if (ctx && masterGain) {
          masterGain.gain.setTargetAtTime(0.9, ctx.currentTime, 0.08);
        }
      } else if (audioCtx && masterGain) {
        masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
      }
    });

    // Experimental Track 1: "hello world" (Morse + formant resonance)
    function playHelloWorld(ctx) {
      const morse = ".... . .-.. .-.. --- / .-- --- .-. .-.. -..";
      const unit = 0.068;
      let t = ctx.currentTime + 0.05;

      for (const ch of morse) {
        if (ch === "." || ch === "-") {
          const dur = ch === "." ? unit : unit * 2.7;
          const osc = ctx.createOscillator();
          const mod = ctx.createOscillator();
          const modGain = ctx.createGain();
          const env = ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(660, t);
          osc.frequency.exponentialRampToValueAtTime(520, t + dur);
          mod.frequency.value = 28;
          modGain.gain.value = 18;
          mod.connect(modGain);
          modGain.connect(osc.frequency);

          env.gain.setValueAtTime(0.0001, t);
          env.gain.exponentialRampToValueAtTime(0.075, t + 0.012);
          env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

          osc.connect(env);
          env.connect(masterGain);
          osc.start(t);
          mod.start(t);
          osc.stop(t + dur + 0.02);
          mod.stop(t + dur + 0.02);
          t += dur + unit * 0.85;
        } else if (ch === " ") {
          t += unit * 2.2;
        } else if (ch === "/") {
          t += unit * 3.2;
        }
      }
      return (t - ctx.currentTime) * 1000;
    }

    // Experimental Track 2: Inharmonic Silver Chimes
    function playSilverChimes(ctx) {
      const freqs = [293.66, 415.30, 587.33, 622.25, 880.0, 1174.66];
      const now = ctx.currentTime + 0.04;
      let maxEnd = 0;

      freqs.forEach((f, idx) => {
        const start = now + idx * 0.42;
        const dur = 1.9;
        const osc = ctx.createOscillator();
        const over = ctx.createOscillator();
        const env = ctx.createGain();

        osc.type = "sine";
        over.type = "triangle";
        osc.frequency.value = f;
        over.frequency.value = f * 2.41;

        env.gain.setValueAtTime(0.0001, start);
        env.gain.exponentialRampToValueAtTime(0.05, start + 0.02);
        env.gain.exponentialRampToValueAtTime(0.0001, start + dur);

        osc.connect(env);
        over.connect(env);
        env.connect(masterGain);
        osc.start(start);
        over.start(start);
        osc.stop(start + dur + 0.05);
        over.stop(start + dur + 0.05);
        maxEnd = Math.max(maxEnd, (start + dur - now) * 1000);
      });
      return maxEnd;
    }

    // Experimental Track 3: Filtered Static Bloom + Sub Sweep
    function playStaticBloom(ctx) {
      const dur = 4.2;
      const bufSize = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.45;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buf;

      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.value = 6.5;
      const now = ctx.currentTime;
      filter.frequency.setValueAtTime(280, now);
      filter.frequency.exponentialRampToValueAtTime(1900, now + 2.1);
      filter.frequency.exponentialRampToValueAtTime(340, now + dur);

      const env = ctx.createGain();
      env.gain.setValueAtTime(0.0001, now);
      env.gain.exponentialRampToValueAtTime(0.08, now + 1.1);
      env.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      noise.connect(filter);
      filter.connect(env);
      env.connect(masterGain);
      noise.start(now);
      noise.stop(now + dur + 0.05);

      return dur * 1000;
    }

    // Experimental Track 4: Oscilloscope Micro-Pulses
    function playMicroPulses(ctx) {
      const now = ctx.currentTime + 0.03;
      const steps = 14;
      let t = now;
      for (let i = 0; i < steps; i++) {
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        const freq = 180 + ((i * 197) % 920);
        osc.type = i % 2 === 0 ? "square" : "sawtooth";
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.55, t + 0.14);

        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(0.035, t + 0.01);
        env.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

        osc.connect(env);
        env.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.18);
        t += 0.24 + (i % 3) * 0.06;
      }
      return (t - now) * 1000;
    }

    const trackPool = [
      { id: "hello_world", fn: playHelloWorld },
      { id: "silver_chimes", fn: playSilverChimes },
      { id: "static_bloom", fn: playStaticBloom },
      { id: "micro_pulses", fn: playMicroPulses }
    ];

    function triggerRandomTrack() {
      // Lock: ignore clicks while current track is still playing
      if (isTrackPlaying) return;

      if (!soundEnabled) {
        soundEnabled = true;
        soundBtn.classList.add("playing");
      }
      const ctx = ensureAudio();
      if (!ctx) return;
      if (masterGain) {
        masterGain.gain.setTargetAtTime(0.9, ctx.currentTime, 0.04);
      }

      let idx = Math.floor(Math.random() * trackPool.length);
      if (trackPool.length > 1 && idx === lastTrackIdx) {
        idx = (idx + 1) % trackPool.length;
      }
      lastTrackIdx = idx;

      titleEl.classList.remove("glitch");
      void titleEl.offsetWidth;
      titleEl.classList.add("glitch");
      nextPhrase();

      isTrackPlaying = true;
      titleEl.classList.add("locked");

      const durationMs = Math.max(800, trackPool[idx].fn(ctx));
      clearTimeout(trackLockTimer);
      trackLockTimer = setTimeout(() => {
        isTrackPlaying = false;
        titleEl.classList.remove("locked");
      }, durationMs);
    }

    titleEl.addEventListener("click", triggerRandomTrack);

    // Invisible / Visible toggle
    let isVisible = false;
    const presenceText = document.getElementById("presence-text");
    const presenceBtn = document.getElementById("presence-btn");
    presenceBtn.addEventListener("click", () => {
      isVisible = !isVisible;
      document.body.classList.toggle("visible-mode", isVisible);
      presenceText.textContent = isVisible ? "You are visible. [signal: 0x07]" : "You are invisible.";
      presenceBtn.textContent = isVisible ? "[Go invisible]" : "[Go visible]";
    });

    // Corner click
    document.querySelectorAll(".corner").forEach((c) => {
      c.addEventListener("click", () => {
        showSecret("NODE // " + c.getAttribute("title") + " LOCKED");
      });
    });

    // Keyboard secret: type "lain"
    let keyBuf = "";
    window.addEventListener("keydown", (e) => {
      if (e.key.length !== 1) return;
      keyBuf = (keyBuf + e.key.toLowerCase()).slice(-4);
      if (keyBuf === "lain") {
        titleEl.classList.remove("glitch");
        void titleEl.offsetWidth;
        titleEl.classList.add("glitch");
        showSecret("LET'S ALL LOVE LAIN");
        keyBuf = "";
      }
    });
  </script>
</body>
</html>
